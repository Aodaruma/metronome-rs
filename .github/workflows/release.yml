name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          }
          cargo_version="$(python - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as file:
              print(tomllib.load(file)['package']['version'])
          PY
          )"
          [[ "v${cargo_version}" == "${tag}" ]] || {
            echo "Cargo.toml version ${cargo_version} does not match ${tag}" >&2
            exit 1
          }
          echo "version=${cargo_version}" >> "${GITHUB_OUTPUT}"

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgtk-3-dev libxdo-dev
          libayatana-appindicator3-dev libx11-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - run: rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libgtk-3-dev libxdo-dev
          libayatana-appindicator3-dev libx11-dev pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: >-
          python scripts/package_release.py
          --target "${{ matrix.target }}"
          --version "${{ needs.validate.outputs.version }}"
          --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}" \
              --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
