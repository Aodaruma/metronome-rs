[package]
name = "metronome-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.1"
directories = "5.0.1"
eframe = "0.35.0"
hound = "3.5.1"
rfd = "0.17.2"
rtrb = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.0", features = ["all"] }
sys-locale = "0.3.2"
thiserror = "2.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = "0.19.3"
raw-window-handle = "0.6.2"
