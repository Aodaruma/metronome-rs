[package]
name = "metronome-rs"
version = "1.0.2"
edition = "2024"
build = "build.rs"

[package.metadata.winresource]
FileDescription = "metronome-rs desktop metronome"
ProductName = "metronome-rs"
OriginalFilename = "metronome-rs.exe"
LegalCopyright = "Copyright © 2026 Aodaruma"

[dependencies]
auto-launch = "0.6.0"
cpal = "0.18.1"
directories = "5.0.1"
eframe = "0.35.0"
global-hotkey = "0.8.0"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
rfd = "0.17.2"
rtrb = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.0", features = ["all"] }
sys-locale = "0.3.2"
thiserror = "2.0"
tray-icon = "0.24.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
muda = "0.19.3"
raw-window-handle = "0.6.2"

[build-dependencies]
winresource = "0.1.31"
